name: 上 TestFlight

# 手動按一下就跑，或推 v 開頭的 tag。
# 需要五個 Secrets：APPLE_TEAM_ID、APPLE_DIST_P12_BASE64、APPLE_DIST_P12_PASSWORD、
# ASC_KEY_ID、ASC_ISSUER_ID、ASC_KEY_P8_BASE64。設定方法在 docs/TestFlight.md。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KEYCHAIN_PATH: ${{ runner.temp }}/shuji.keychain-db
      ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 把發行憑證裝進暫時的 keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          set -e
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: 放 App Store Connect API 金鑰
        env:
          P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"

      - name: Archive（自動簽章：Xcode 會自己註冊 App ID、App Group、描述檔）
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Shuji.xcodeproj \
            -scheme Shuji \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Shuji.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tail -n 120

      - name: 匯出並上傳 TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Shuji.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tail -n 80
          ls -la build/export || true

      - name: 收拾 keychain 與金鑰
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$ASC_KEY_PATH"
