name: iOS 建置與測試

on:
  push:
    branches: [main, ios-app]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 挑一台可用的 iPhone 模擬器
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          names = [d["name"] for runtime, devs in data.items() if "iOS" in runtime for d in devs if d["name"].startswith("iPhone")]
          print(names[-1] if names else "iPhone 16")')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "用 $NAME"

      - name: 建置並跑單元測試
        run: |
          set -o pipefail
          xcodebuild test \
            -project Shuji.xcodeproj \
            -scheme Shuji \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200

      - name: 打包未簽名的 IPA（給 Sideloadly / AltStore 自己簽）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Shuji.xcodeproj \
            -scheme Shuji \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Shuji.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | tail -n 100
          mkdir -p build/Payload
          cp -R build/Shuji.xcarchive/Products/Applications/Shuji.app build/Payload/
          (cd build && zip -qr Shuji-unsigned.ipa Payload)
          ls -la build/Shuji-unsigned.ipa

      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shuji-unsigned-ipa
          path: build/Shuji-unsigned.ipa
          retention-days: 30

      - name: 上傳測試結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Tests.xcresult
          retention-days: 7
