name: iOS 建置與測試

on:
  push:
    branches: [main, ios-app]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: AI 中繼伺服器測試
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Worker 打包檢查（不部署）
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry

  ui-tokens:
    name: 畫面只用 Domy 代號
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-ui-tokens.mjs

  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 挑一台可用的 iPhone 模擬器（最新 iOS runtime，用 UDID 指定）
        id: sim
        run: |
          PICK=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devs in data.items():
              if "iOS" not in runtime:
                  continue
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              ver = tuple(int(x) for x in m.groups()) if m else (0, 0)
              for d in devs:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      key = (ver, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"], runtime)
          if best is None:
              sys.exit("找不到任何 iPhone 模擬器")
          print(best[1] + "|" + best[2] + "|" + best[3])')
          echo "id=${PICK%%|*}" >> "$GITHUB_OUTPUT"
          echo "用 $PICK"

      - name: 建置並跑單元測試
        run: |
          set -o pipefail
          xcodebuild test \
            -project Shuji.xcodeproj \
            -scheme Shuji \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200

      - name: 打包模擬器版 .app（通用架構，給 Limrun 雲端模擬器）
        run: |
          set -o pipefail
          xcodebuild build             -project Shuji.xcodeproj             -scheme Shuji             -configuration Debug             -destination "generic/platform=iOS Simulator"             -derivedDataPath build/sim             CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO             | tail -n 60
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry ../../../../Shuji-simulator.app.zip Shuji.app)
          ls -la build/Shuji-simulator.app.zip

      - name: 上傳模擬器版 .app
        uses: actions/upload-artifact@v4
        with:
          name: Shuji-simulator-app
          path: build/Shuji-simulator.app.zip
          retention-days: 30

      - name: 打包未簽名的 IPA（給 Sideloadly / AltStore 自己簽）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Shuji.xcodeproj \
            -scheme Shuji \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Shuji.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | tail -n 100
          mkdir -p build/Payload
          cp -R build/Shuji.xcarchive/Products/Applications/Shuji.app build/Payload/
          (cd build && zip -qr Shuji-unsigned.ipa Payload)
          ls -la build/Shuji-unsigned.ipa

      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shuji-unsigned-ipa
          path: build/Shuji-unsigned.ipa
          retention-days: 30

      - name: 上傳測試結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Tests.xcresult
          retention-days: 7
